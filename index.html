<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lost on Mars - My Place in Space</title>
<style>html,body{margin:0;height:100%;background:#0b0618;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}body{display:flex;align-items:center;justify-content:center}canvas{display:block;touch-action:none}</style>
</head><body><canvas id="c" width="480" height="720"></canvas><script>
(() => {
'use strict';
/* LOST ON MARS - "My Place in Space". Inspired by Māori astronomy and culture.
   All art is canvas shapes, all sound is Web Audio. */
const CONFIG = {
  speedScared: 105, speedBrave: 150, pathHalfWidth: 98,
  fearAfterKoru: 30, fearAfterPounamu: 8,
  dialogSpeed: 1, shake: 1, musicVolume: 0.5, sfxVolume: 0.9
};
const W = 480, H = 720, HZ = 100, TAU = Math.PI * 2, KORU_Y = 3230, SITE_Y = 1380, SX = 108, SY = 4335;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t, sm = t => t * t * (3 - 2 * t);
const rnd = (a, b) => a + Math.random() * (b - a), sin = Math.sin, cos = Math.cos, hyp = Math.hypot;
const F = (p, b) => (b ? 'bold ' : '') + p + 'px "Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif';
let K = 1;
function resize() {
  const sc = Math.min((innerWidth || W) / W, (innerHeight || H) / H);
  cv.style.width = Math.floor(W * sc) + 'px'; cv.style.height = Math.floor(H * sc) + 'px';
  K = clamp(sc * (devicePixelRatio || 1), 1, 2.5); cv.width = Math.round(W * K); cv.height = Math.round(H * K);
}
addEventListener('resize', resize); resize();

/* ---------- tiny draw helpers ---------- */
const dot = (x, y, r, c) => { if (c) ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };
const ell = (x, y, rx, ry, c, rot) => { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill(); };
const lg = (x0, y0, x1, y1, ...s) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < s.length; i += 2) g.addColorStop(s[i], s[i + 1]); return g; };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function wrap(text, maxW) {
  const lines = []; let line = '';
  for (const w of text.split(' ')) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  return line ? lines.concat(line) : lines;
}
function starShape(r1, r2, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = (rot || 0) + i * Math.PI / n - Math.PI / 2, r = i % 2 ? r2 : r1; ctx[i ? 'lineTo' : 'moveTo'](cos(a) * r, sin(a) * r); }
  ctx.closePath();
}
function glow(r, c0, c1, alpha) {
  const p = ctx.globalCompositeOperation, a = ctx.globalAlpha; ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, c0); g.addColorStop(1, c1);
  ctx.globalAlpha = a * alpha; dot(0, 0, r, g); ctx.globalCompositeOperation = p; ctx.globalAlpha = a;
}
const txt = (s, x, y, font, fill, align, stroke) => {
  ctx.font = font; ctx.textAlign = align || 'center';
  if (stroke) { ctx.lineWidth = stroke[1]; ctx.strokeStyle = stroke[0]; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
};

/* ---------- SOUND (Web Audio only) ---------- */
const Snd = (() => {
  let ac, master, music, sfx, nb, muted = false, mood = 'calm', nextT = 0, step = 0;
  const A = { fearLevel: 0 };
  const P1 = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25], PM = [220, 261.63, 293.66, 329.63, 392, 440];
  const CH = [[130.8, 196, 261.6], [110, 164.8, 220], [87.3, 130.8, 174.6], [98, 146.8, 196]];
  A.init = () => {
    if (ac) { if (ac.state === 'suspended') try { ac.resume(); } catch (e) {} return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC();
      const g = v => { const n = ac.createGain(); n.gain.value = v; n.connect(master || ac.destination); return n; };
      master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
      music = g(CONFIG.musicVolume); sfx = g(CONFIG.sfxVolume);
      nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      nextT = ac.currentTime + 0.15; setInterval(sched, 80);
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  };
  function tone(f, d, type, v, delay, bus, to, att) {
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain(), a = att || 0.01, e = t0 + Math.max(d, a + 0.03);
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, e);
    o.connect(g); g.connect(bus || sfx); o.start(t0); o.stop(e + 0.1);
  }
  function noise(d, v, type, f0, f1, delay, bus) {
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0), s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; s.loop = true; fl.type = type || 'lowpass';
    fl.frequency.setValueAtTime(f0, t0); fl.frequency.exponentialRampToValueAtTime(f1, t0 + d);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + Math.min(0.1, d / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(fl); fl.connect(g); g.connect(bus || sfx); s.start(t0); s.stop(t0 + d + 0.1);
  }
  const arp = (n, gap, v, dl, ty) => n.forEach((f, i) => { tone(f, 1.3, ty, v, (dl || 0) + i * gap); tone(f * 2, 0.8, 'triangle', v * 0.3, (dl || 0) + i * gap); });
  const pad = (fr, d, dur, v) => fr.forEach(f => { tone(f, dur, 'sine', v, d, music, 0, dur * 0.4); tone(f * 1.004, dur, 'triangle', v * 0.5, d, music, 0, dur * 0.4); });
  function sched() {
    if (!ac || ac.state !== 'running') { if (ac) nextT = ac.currentTime + 0.1; return; }
    for (let n = 0; nextT < ac.currentTime + 0.3 && n < 8; n++) { beat(step++, Math.max(0, nextT - ac.currentTime)); nextT += 30 / ({ scared: 66, brave: 100, win: 108 }[mood] || 60); }
  }
  function beat(i, d) {
    const r = Math.random;
    if (mood === 'scared') {
      if (i % 32 === 0) pad([110, 164.81], d, 6, 0.05);
      if (i % 4 === 0 && r() < 0.6) tone(PM[(r() * PM.length) | 0] * (r() < 0.3 ? 2 : 1), 1.6, 'triangle', 0.05, d, music, 0, 0.05);
      if (i % 2 === 0 && A.fearLevel > 0.2) { tone(62, 0.14, 'sine', 0.16 * A.fearLevel, d, music, 38); tone(58, 0.12, 'sine', 0.11 * A.fearLevel, d + 0.2, music, 36); }
      if (i % 2 === 1 && r() < 0.08) tone(1568, 0.9, 'sine', 0.02, d, music);
    } else if (mood === 'brave' || mood === 'win') {
      const hi = mood === 'win' ? 2 : 1, ch = CH[((i / 8) | 0) % 4];
      tone(P1[[0, 2, 4, 5, 4, 2, 3, 1][i % 8]] * hi, 0.4, mood === 'win' ? 'sine' : 'triangle', 0.07, d, music);
      if (i % 8 === 0) pad(ch, d, 4.2, 0.045);
      if (i % 4 === 0) tone(ch[0], 0.5, 'sine', 0.09, d, music);
      if (i % 2 === 1) noise(0.05, 0.012, 'highpass', 6000, 8000, d, music);
      if (mood === 'win' && i % 4 === 2 && r() < 0.6) tone(P1[(r() * 8) | 0] * 4, 0.6, 'sine', 0.025, d, music);
    } else {
      if (i % 32 === 0) pad([130.8, 196, 261.6], d, 7, 0.04);
      if (i % 4 === 0 && r() < 0.5) tone(P1[(r() * 8) | 0], 1.8, 'sine', 0.04, d, music, 0, 0.05);
    }
  }
  return Object.assign(A, {
    setMood: m => { mood = m; },
    toggleMute: () => { muted = !muted; if (master) master.gain.value = muted ? 0 : 1; },
    isMuted: () => muted,
    squeak: () => { tone(1500, 0.09, 'sine', 0.13, 0, 0, 2400); tone(2300, 0.08, 'sine', 0.11, 0.09, 0, 1500); },
    stepS: () => tone(520 + Math.random() * 80, 0.04, 'square', 0.025, 0, 0, 380),
    stepB: () => { tone(130, 0.09, 'sine', 0.14, 0, 0, 70); tone(900, 0.03, 'triangle', 0.03); },
    blip: who => { if (who === 'astro') { const f = 520 + Math.random() * 240; tone(f, 0.05, 'square', 0.03); tone(f * 1.25, 0.06, 'square', 0.03, 0.06); } else { tone(880 + Math.random() * 120, 0.18, 'sine', 0.05); tone(1320, 0.18, 'sine', 0.025, 0.07); } },
    gift: () => { arp([523.25, 659.25, 783.99, 1046.5, 1318.5], 0.11, 0.12); tone(261.6, 2, 'sine', 0.08, 0, 0, 0, 0.4); },
    transform: () => { A.gift(); arp([392, 523.25, 659.25, 783.99, 1046.5, 1568], 0.08, 0.07, 0.6); tone(98, 1.6, 'sine', 0.2, 0, 0, 196, 0.2); },
    tink: () => { tone(1318.5, 1.2, 'sine', 0.12); tone(1760, 1, 'sine', 0.09, 0.05); tone(2637, 0.6, 'sine', 0.04, 0.1); },
    unlock: () => { tone(900, 0.03, 'square', 0.1); tone(1400, 0.05, 'square', 0.08, 0.07); noise(0.9, 0.18, 'bandpass', 300, 1800, 0.25); tone(120, 0.3, 'sine', 0.2, 1, 0, 60); },
    door: () => { noise(0.7, 0.16, 'bandpass', 1500, 300); tone(100, 0.25, 'sine', 0.16, 0.6, 0, 55); },
    beep: go => go ? tone(990, 0.5, 'square', 0.09) : tone(660, 0.15, 'square', 0.07),
    launch: () => { noise(4.8, 0.5, 'lowpass', 200, 5000); tone(55, 5, 'sawtooth', 0.14, 0, 0, 420, 0.5); tone(110, 5, 'square', 0.05, 0, 0, 880, 0.8); arp([1046.5, 1318.5, 1568, 2093], 0.2, 0.06, 3.2); },
    win: () => arp([523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5, 1568], 0.16, 0.12),
    spook: () => { noise(0.7, 0.2, 'bandpass', 2500, 400); A.squeak(); },
    pip: () => tone(900, 0.07, 'triangle', 0.08, 0, 0, 1400),
    thanks: () => { tone(659.25, 0.25, 'sine', 0.12); tone(880, 0.4, 'sine', 0.12, 0.12); },
    click: () => { tone(500, 0.08, 'square', 0.06); tone(750, 0.1, 'square', 0.05, 0.07); },
    ping: () => { tone(1760, 1.2, 'sine', 0.07); tone(2349, 1, 'sine', 0.04, 0.1); },
    guideAppear: () => arp([784, 988, 1175, 1568], 0.09, 0.07),
    braveStep: () => { tone(98, 0.5, 'sine', 0.25, 0, 0, 55); tone(392, 0.4, 'triangle', 0.08, 0.05); }
  });
})();

/* ---------- WORLD: Mars path scrolls north (up). World y shrinks going north ---------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pathX = y => 240 + sm(clamp((4250 - y) / 350, 0, 1)) * sm(clamp((y - 1330) / 320, 0, 1)) * 64 * (sin(y / 230) + 0.35 * sin(y / 87 + 1));
let camY = 0;
const persp = sy => clamp(0.5 + 0.5 * (sy - HZ) / (520 - HZ), 0.35, 1.3);
const proj = (wx, wy) => { const s = persp(wy - camY); return { x: 240 + (wx - 240) * s, y: wy - camY, s }; };

const R = mulberry32(11), decor = [], grains = [], stars = [], HW = CONFIG.pathHalfWidth;
for (let i = 0; i < 110; i++) stars.push({ x: R() * W, y: R() * (HZ - 8), r: R() * 1.3 + 0.3, p: R() * TAU, sp: 1 + R() * 2 });
for (let i = 0; i < 1700; i++) grains.push({ x: R() * W, y: 600 + R() * 3950, s: 1 + R() * 2.2, l: R() < 0.5 });
for (let y = 620; y < 4520; y += R() * 22 + 10) {
  const sd = R() < 0.5 ? -1 : 1, x = pathX(y) + sd * (HW + 24 + Math.pow(R(), 1.3) * 220);
  if (x < -30 || x > 510) continue;
  const r = R();
  decor.push(r < 0.42 ? { t: 'rock', x, y, s: 6 + R() * 18, v: R() } : r < 0.7 ? { t: 'crater', x, y, s: 12 + R() * 34, v: R() } : { t: 'pebbles', x, y, s: 4 + R() * 6, v: R() });
}
[[4060, -1, 1], [3900, 1, 1], [3500, -1, 1], [2600, -1], [1800, 1], [3000, 1], [2200, -1]].forEach(([y, sd, e]) =>
  decor.push({ t: 'rock', x: pathX(y) + sd * (HW + (e ? 16 : 18)), y, s: e ? 21 : 19, v: R(), eyes: !!e }));
decor.sort((a, b) => a.y - b.y);

const QUIPS = [
  [4020, 's', "That rock has eyes. ROCKS DON'T HAVE EYES."], [3820, 's', 'Mars is very red. And very... empty.'],
  [3600, 's', 'My knees are clapping. Without me.'], [3420, 's', 'I only pressed the DO NOT button once.'],
  [3300, 's', 'Something follows me. Oh. My shadow.'], [2900, 'b', 'Brave mode: ON. Mostly.'],
  [2600, 'b', 'Hey rocks. Sorry I screamed earlier.'], [2300, 'b', 'Walking is my superpower. Left, right, repeat.'],
  [2000, 'b', 'No footprints here. Just mine. Cool.'], [1700, 'b', 'North side, here I come!'],
  [1750, 'r', "Heading home. Please don't be locked again."], [2300, 'r', 'Ngā mihi, rocks. You were great.'],
  [2900, 'r', "I wave at a rock. ...Rocks don't wave back."], [3500, 'r', "I'm naming that blob Kevin."],
  [3950, 'r', 'I see the ship! It looks so tiny and crashed.']
];
const ITEMS = {
  koru: { name: 'Koru (bone pendant)', text: 'A koru is a spiral that stands for new life, growth and peace.', slot: 0 },
  pounamu: { name: 'Pounamu (greenstone)', text: 'A treasured taonga. Pounamu is traditionally gifted.', slot: 1 },
  jewel: { name: 'Moon jewel (story taonga)', text: "Maramataka is the Māori lunar calendar. It follows the moon's phases.", slot: 2 }
};
const slotX = i => 309 + i * 44;

/* ---------- STATE ---------- */
let state = 'title', G = null, titleT = 0, winT = 0;
function newGame() {
  G = {
    t: 0, px: 240, py: 4150, vx: 0, vy: 0, wp: 0, face: 1, walkA: 0, prevSin: 0, dustT: 0,
    fear: 100, fearT: 100, brave: 0, hasKoru: false, hasPou: false, hasJewel: false, stage: 0,
    minY: KORU_Y, maxY: 4235, frozen: true, scene: null, wait: null, bubble: null, caption: null, hint: '', hint2T: 0, prompt: null,
    spook: 0, spookT: 9, shakeExtra: 0, jumpT: 0, squeakT: 5, squeak: 0, meteor: null,
    guide: { x: 330, y: 0, tx: 330, ty: 0, mode: 'hidden', a: 0, sparkT: 0 }, gift: null, fly: null, ring: null,
    starPing: false, northProg: 0, matFocus: 0, jewelFloat: false, hudPulse: [0, 0, 0], parts: [],
    ship: { x: SX, y: SY, tilt: -0.14, doorOpen: 0, doorTarget: 0, slot: 0, socket: 0, flame: 0, vy: 0, alt: 0, smokeT: 0 },
    autoWalk: null, noClamp: false, entering: false, enterT: 0, playerAlpha: 1, inShip: false,
    showMoon: false, moonF: 0.12, moonTarget: 0.12, count: '', liftoff: false,
    quips: QUIPS.map(q => ({ y: q[0], w: q[1], t: q[2], done: false })),
    critters: [[3950, 1], [3700, -1], [2750, 1], [2150, -1], [1850, 1]].map(([y, sd]) => ({ y, x: pathX(y) + sd * (HW + 32), peek: 0, said: false, pipped: false }))
  };
  camY = G.py - 520; G.guide.y = camY + 30;
}
newGame();

function spawn(o) { if (G.parts.length > 420) G.parts.shift(); G.parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 1, age: 0, size: 3, grow: 0, color: '#fff', g: 0, add: false, screen: false, drag: 0, shape: 'c', rot: Math.random() * 6, alpha: 1 }, o)); }
function burst(x, y, n, cols, speed, screen) {
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, sp = speed * (0.3 + Math.random() * 0.8); spawn({ x, y, vx: cos(a) * sp, vy: sin(a) * sp, life: 0.8 + Math.random() * 0.8, size: 2 + Math.random() * 3.5, color: cols[(Math.random() * cols.length) | 0], add: true, screen: !!screen, drag: 1.2, shape: 's' }); }
}
function updateParts(dt) {
  const a = G.parts;
  for (let i = a.length - 1; i >= 0; i--) {
    const p = a[i]; p.age += dt;
    if (p.age >= p.life) { a.splice(i, 1); continue; }
    p.vy += p.g * dt; if (p.drag) { const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
const sparkle = (x, y, c, o) => spawn(Object.assign({ x, y, vy: -12, life: 0.9, size: 2.5, color: c || '#fff6c0', add: true, shape: 's' }, o));

/* ---------- SCENE ENGINE (generators = easy story scripting) ---------- */
function startScene(gen) { G.scene = gen(); G.wait = null; stepScene(); }
function stepScene() {
  for (let n = 0; G.scene && n < 50; n++) {
    const r = G.scene.next();
    if (r.done) { G.scene = null; G.wait = null; return; }
    const w = r.value;
    if (w && (w.time > 0 || w.until)) { G.wait = { t: w.time || 0, until: w.until, skip: !!w.skip, max: w.max || 0, el: 0 }; return; }
  }
}
function updateScene(dt) {
  if (!G.scene) return;
  const w = G.wait; if (!w) return stepScene();
  w.el += dt;
  if (w.until ? (w.until() || (w.max && w.el > w.max)) : w.el >= w.t) { G.wait = null; stepScene(); }
}
function* say(who, text, dur) {
  dur = (dur || 1.6 + text.length * 0.04) / CONFIG.dialogSpeed;
  G.bubble = { who, text, age: 0, dur }; Snd.blip(who);
  yield { time: dur, skip: true }; G.bubble = null; yield { time: 0.12 };
}
function* talk(...ls) { for (const l of ls) yield* say(...l); }
function* ask(label, sub, kind) { G.prompt = { label, sub, pressed: false, kind: kind || 'thanks' }; yield { until: () => G.prompt.pressed }; G.prompt = null; }
function guideTo(x, y) { G.guide.mode = 'scene'; G.guide.tx = x; G.guide.ty = y; }
const guideNear = () => hyp(G.guide.x - G.guide.tx, G.guide.y - G.guide.ty) < 14;
const caption = (title, text, dur) => { G.caption = { title, text, t: 0, dur: dur || 5 }; };
const playerScreen = () => proj(G.px, G.py);
function shipPart(name) {
  const l = name === 'slot' ? [0, -34] : [22, -84], th = G.ship.tilt, c = cos(th), s = sin(th);
  return proj(G.ship.x + l[0] * c - l[1] * s, G.ship.y + l[0] * s + l[1] * c);
}
const jump = (t, s) => { G.jumpT = t; G.squeak = 0.4; if (s) { Snd.squeak(); } };
function* giftScene(kind, from, dest) { G.gift = { kind, t: 0, d1: 1, d2: 2.6, d3: 0.9, from, dest, arrived: false }; yield { until: () => !G.gift }; }
function giftArrive(kind) {
  Snd.gift(); caption(ITEMS[kind].name, ITEMS[kind].text, 4.6); burst(240, 330, 30, ['#fff3b0', '#9ff5d6', '#fff'], 190, true);
  if (kind === 'koru') { G.hasKoru = true; G.fearT = CONFIG.fearAfterKoru; Snd.setMood('brave'); Snd.transform(); G.jumpT = 0.5; }
  else if (kind === 'pounamu') { G.hasPou = true; G.fearT = CONFIG.fearAfterPounamu; Snd.tink(); }
  else { G.hasJewel = true; Snd.tink(); }
}

/* ---------- STORY ---------- */
function* sceneIntro() {
  G.frozen = true; yield { time: 0.8 };
  yield* talk(['astro', 'Oops. The door shut behind me.']);
  jump(0.35, 1);
  yield* talk(['astro', "I'm locked out. On MARS."]);
  G.starPing = true; Snd.ping();
  yield* talk(['astro', 'That star up north keeps blinking at me...']);
  G.hint = 'Walk north ↑'; G.hint2T = 12; G.frozen = false;
}
function* sceneKoru() {
  G.frozen = true; G.hint = ''; G.vx = G.vy = 0;
  const ry = G.py - 120, g = G.guide;
  g.mode = 'scene'; g.x = pathX(ry) + 40; g.y = camY - 20; g.a = 0.01; guideTo(pathX(ry) + 78, ry - 62); Snd.guideAppear();
  yield { until: guideNear, max: 3 };

function drawSpaceOverlay() {

function drawBubble() {

/* ---------- SCREENS ---------- */
function drawWorld(shake) {
  ctx.save(); if (shake > 0.05) ctx.translate((Math.random() - 0.5) * 2 * shake, (Math.random() - 0.5) * 2 * shake);
  drawSky(G.t); ctx.save(); ctx.beginPath(); ctx.rect(-30, HZ - 3, W + 60, H); ctx.clip();
  drawGround(); drawClearing(G.t); drawRing(G.t); drawObjects();
  ctx.fillStyle = lg(0, HZ, 0, HZ + 150, 0, 'rgba(255,190,150,.6)', 1, 'rgba(255,190,150,0)'); ctx.fillRect(-30, HZ - 3, W + 60, 153);
  ctx.restore(); ctx.restore();
}
function renderPlay() {
  const gd = G.guide;
  drawWorld(CONFIG.shake ? Math.max(G.spook * 7, G.fear > 55 && G.brave < 0.5 ? (G.fear - 55) / 45 * 1.4 : 0, G.shakeExtra) * CONFIG.shake : 0);

  }

}
function renderTitle() {
  G.guide.mode = 'hidden'; drawWorld(0); drawParticles();
  const t = titleT, p = proj(240, 4150);
  drawAstro(p.x, p.y, p.s * 1.15, { brave: 0, fear: 1, t, walk: 0, wp: 0, face: 1, vx: 0, alpha: 1, jump: 0, squeak: (t % 4) < 0.25 ? 1 : 0 });

  txt('My Place in Space · a Māori star story', 240, 222, F(16, 1), '#ffe9d2', 'center', ['rgba(40,10,20,.8)', 4]);
  drawButton(BTN_PLAY, 'Play', '', t);

}
function drawWin() {

  [['koru', 'Koru', 'New life, growth and peace.'], ['pounamu', 'Pounamu', 'A treasured taonga, traditionally gifted.'], ['jewel', 'Maramataka', 'The Māori lunar calendar, following the moon.'], ['star', 'Matariki', 'Stars that mark the Māori new year.']].forEach((r, i) => {

    ctx.restore(); txt(r[1], 104, y, F(16, 1), '#ffe48a', 'left'); txt(r[2], 104, y + 20, F(13), '#fff', 'left');

  ctx.font = F(13); wrap('Inspired by Māori astronomy and culture. Learn more at Te Papa and Te Ara.', 400).forEach((l, i) => txt(l, 240, 578 + i * 18, F(13), '#e9dcff'));

function render() {

let last = 0;
