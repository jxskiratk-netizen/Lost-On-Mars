const KORU_Y = 3230, SITE_Y = 1380, SHIP_X = 108, SHIP_Y = 4335;
let camY = 0, state = 'title', titleT = 0, winT = 0, parts = [], waits = [], skipNow = null, pointer = null;
const keys = {};
const g = { t: 0, px: 240, py: 4150, vx: 0, vy: 0, face: 1, wp: 0, walk: 0, prevSin: 0, dustT: 0,
  fear: 100, fearTarget: 100, brave: 0, hasKoru: false, hasPou: false, stage: 0, minY: KORU_Y, maxY: 4235,

const ITEMS = { koru: ['Koru (bone pendant)', 'A koru is a spiral ornament that represents new life, growth and hope helping the scared astronaut to believe in himself.', 0],
  pounamu: ['Pounamu (greenstone)', 'A greenstone that represents spiritual connection and strength helping the scared astronaut to overcome his fear.', 1],
  jewel: ['Moon jewel (story taonga)', "Maramataka, turning of moons symbolises a new chapter in  is the Māori lunar calendar. It follows the moon's phases.", 2] };
const QUIPS = [ 
  [4020, 's', "That rock has eyes. ROCKS DON'T HAVE EYES."], [3820, 's', 'Mars is very red. And very... empty.'], [3600, 's', 'Someone is watching me. I can feel it.'],
  [3420, 's', 'I only pressed the DO NOT button once.'], [3300, 's', 'Oh God'], [2900, 'b', 'Brave mode: ON'],
  [2600, 'b', 'Hey rocks. Sorry I screamed earlier.'], [2300, 'b', 'Walking is my superpower. Left, right, repeat.'], [2000, 'b', 'No footprints here. Just mine.'],
  [1700, 'b', 'North side, here I come!'], [1750, 'r', "Heading home."], [2300, 'r', 'Ngā mihi, rocks. You were great.'],
  [2900, 'r', "I wave at a rock. ...Rocks don't wave back."], [3950, 'r', 'I see the ship! It looks so tiny and crashed.']];
const quipsDone = new Set();


const pathX = y => 240 + smooth(clamp((4250 - y) / 350, 0, 1)) * smooth(clamp((y - 1330) / 320, 0, 1)) * 64 * (sin(y / 230) + .35 * sin(y / 87 + 1));
const depth = sy => clamp(.5 + .5 * (sy - HORIZON) / (520 - HORIZON), .35, 1.3);   // things lower on screen look bigger
const proj = (wx, wy) => { const s = depth(wy - camY); return { x: 240 + (wx - 240) * s, y: wy - camY, s }; };   
const seeded = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = seeded(11), decor = [], grains = [], stars = [];
for (let i = 0; i < 110; i++) stars.push({ x: R() * W, y: R() * (HORIZON - 8), r: R() * 1.3 + .3, p: R() * TAU, sp: 1 + R() * 2 });
for (let i = 0; i < 1700; i++) grains.push({ x: R() * W, y: 600 + R() * 3950, s: 1 + R() * 2.2, light: R() < .5 });
for (let y = 620; y < 4520; y += R() * 22 + 10) {
  const x = pathX(y) + (R() < .5 ? -1 : 1) * (PATH_HALF + 24 + Math.pow(R(), 1.3) * 220), r = R(); if (x < -30 || x > 510) continue;
  decor.push(r < .42 ? { type: 'rock', x, y, s: 6 + R() * 18, v: R() } : r < .7 ? { type: 'crater', x, y, s: 12 + R() * 34, v: R() } : { type: 'pebbles', x, y, s: 4 + R() * 6, v: R() });
}
[[4060, -1], [3900, 1], [3500, -1], [2600, -1], [1800, 1], [3000, 1], [2200, -1]].forEach(([y, side]) => decor.push({ type: 'rock', x: pathX(y) + side * (PATH_HALF + 17), y, s: 21, v: R(), eyes: true }));
decor.sort((a, b) => a.y - b.y);
const critters = [[3950, 1], [3700, -1], [2750, 1], [2150, -1], [1850, 1]].map(([y, side]) => ({ y, x: pathX(y) + side * (PATH_HALF + 32), peek: 0, said: false }));


let ac, master, muted = false, mood = 'scared', beat = 0;
function startAudio() {  
  if (ac) return ac.resume();
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.connect(ac.destination); setInterval(playMusic, 450);
}
function tone(freq, secs, wave = 'sine', vol = .1, delay = 0, slideTo = 0) {   
  if (!ac) return;
  const t = ac.currentTime + delay, osc = ac.createOscillator(), loud = ac.createGain();
  osc.type = wave; osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + secs);
  loud.gain.setValueAtTime(.0001, t); loud.gain.exponentialRampToValueAtTime(Math.max(.001, vol), t + .02); loud.gain.exponentialRampToValueAtTime(.0001, t + secs);
  osc.connect(loud); loud.connect(master); osc.start(t); osc.stop(t + secs + .1);
}
function whoosh(secs, vol, from, to) {   
  if (!ac) return;
  const n = ac.sampleRate * secs, buf = ac.createBuffer(1, n, ac.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(), filter = ac.createBiquadFilter(), loud = ac.createGain(), t = ac.currentTime;
  filter.type = 'bandpass'; filter.frequency.setValueAtTime(from, t); filter.frequency.exponentialRampToValueAtTime(to, t + secs);

  src.buffer = buf; src.connect(filter); filter.connect(loud); loud.connect(master); src.start();
}
const SCALE = [220, 262, 294, 330, 392, 440], MELODY = [262, 330, 392, 440, 392, 330, 349, 294];
function playMusic() {   
  if (!ac || ac.state !== 'running') return; beat++;
  if (mood === 'scared') {
    if (beat % 3 === 0) tone(SCALE[Math.floor(Math.random() * 6)], 1.4, 'triangle', .1);
    if (beat % 2 === 0 && !g.hasKoru && g.fear > 20) { tone(62, .15, 'sine', .3 * g.fear / 100, 0, 38); tone(58, .12, 'sine', .2 * g.fear / 100, .2, 36); }

    tone(MELODY[beat % 8] * (mood === 'win' ? 2 : 1), .4, 'triangle', .1);
    if (beat % 8 === 0) tone(130, 1.5, 'sine', .14);
  }
}
const sfx = {
  squeak() { tone(1500, .09, 'sine', .13, 0, 2400); tone(2300, .08, 'sine', .11, .09, 1500); },
  step() { tone(520, .04, 'square', .025, 0, 380); }, stepB() { tone(130, .09, 'sine', .14, 0, 70); },
  blip(who) { who === 'astro' ? tone(520 + rand(0, 240), .06, 'square', .03) : tone(900 + rand(0, 120), .18, 'sine', .05); },
  gift() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 1.2, 'sine', .12, i * .11)); },
  transform() { sfx.gift(); [392, 523, 659, 784, 1047, 1568].forEach((f, i) => tone(f, 1.2, 'sine', .07, .6 + i * .08)); },
  tink() { tone(1318, 1.2, 'sine', .12); tone(1760, 1, 'sine', .09, .05); }, ping() { tone(1760, 1.2, 'sine', .07); },
  pip() { tone(900, .07, 'triangle', .08, 0, 1400); }, thanks() { tone(659, .25, 'sine', .12); tone(880, .4, 'sine', .12, .12); },
  guide() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .8, 'sine', .07, i * .09)); },
  click() { tone(500, .08, 'square', .06); tone(750, .1, 'square', .05, .07); }, braveStep() { tone(98, .5, 'sine', .25, 0, 55); tone(392, .4, 'triangle', .08, .05); },
  spook() { whoosh(.7, .2, 2500, 400); sfx.squeak(); }, door() { whoosh(.7, .16, 1500, 300); tone(100, .25, 'sine', .16, .6, 55); },
  unlock() { tone(900, .05, 'square', .1); tone(1400, .06, 'square', .08, .07); whoosh(.9, .18, 300, 1800); tone(120, .3, 'sine', .2, 1, 60); },
  beep(go) { go ? tone(990, .5, 'square', .09) : tone(660, .15, 'square', .07); },
  launch() { whoosh(4.8, .5, 200, 5000); tone(55, 5, 'sawtooth', .14, 0, 420); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 1.3, 'sine', .12, i * .16)); } };


const circle = (x, y, r, color) => { if (color) ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };
const oval = (x, y, rx, ry, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); };
const roundBox = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
const outline = (color, width) => { ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke(); };
const gradient = (x0, y0, x1, y1, ...stops) => { const gr = ctx.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < stops.length; i += 2) gr.addColorStop(stops[i], stops[i + 1]); return gr; };

  ctx.beginPath();

}
function glow(r, inner, outer, amount) { 
  const mode = ctx.globalCompositeOperation, alpha = ctx.globalAlpha, gr = ctx.createRadialGradient(0, 0, 0, 0, 0, r);

function label(text, x, y, font, color) { ctx.font = font; ctx.textAlign = 'center'; ctx.fillStyle = color; ctx.fillText(text, x, y); }


function drawKoru(r, glowAmount) {
  ctx.save(); if (glowAmount) glow(r * 2.2, 'rgba(255,240,200,.7)', 'rgba(255,240,200,0)', glowAmount);
  ctx.lineCap = ctx.lineJoin = 'round';

function drawMoonDisc(r, lit) {   
  ctx.save(); circle(0, 0, r, 'rgba(30,36,80,.9)');

    const a = Math.max(.01, r * Math.abs(1 - 2 * lit)); ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);

function drawAstro(x, y, s, o) {

function drawWin() {

  for (let i = 0; i < 100; i++) { ctx.globalAlpha = .3 + .7 * Math.abs(sin(winT * 1.5 + i)); ctx.fillRect((i * 97.3) % W, (i * 53.1) % 330, 1.8, 1.8); } ctx.globalAlpha = 1;

const hint = (text, sub = '') => $('hint').innerHTML = text ? text + (sub ? '<small>' + sub + '</small>' : '') : '';
let capTimer;

}
const place = (el, p) => { el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; };
const jump = () => { g.jumpT = .45; g.squeak = .4; sfx.squeak(); };
const count = text => { $('count').textContent = text; $('count').animate([{ transform: 'scale(1.3)' }, { transform: 'scale(1)' }], 300); };
const guideTo = (x, y) => { g.guide.mode = 'scene'; g.guide.tx = x; g.guide.ty = y; };

function shipPart(dx, dy) { const c = cos(g.ship.tilt), s = sin(g.ship.tilt); return proj(SHIP_X + dx * c - dy * s, g.ship.y + dx * s + dy * c); }   // a point on the ship, in screen coordinates
const pause = secs => new Promise(done => {   // a wait the player can skip by tapping / pressing space
  const t = setTimeout(finish, secs * 1000); function finish() { clearTimeout(t); skipNow = null; done(); } skipNow = finish; });

async function say(who, text, secs = 1.6 + text.length * .04) {
  g.talking = true; $('bubble').textContent = text; $('bubble').className = 'show ' + who; sfx.blip(who);

}

async function gift(kind, from) {

async function sceneIntro() {
  await wait(.8);
  await say('astro', 'Oops. The door shut behind me.'); jump();
  await say('astro', "I'm locked out. On MARS."); g.ping = true; sfx.ping();

  g.frozen = true; hint(''); const ry = g.py - 120, gd = g.guide;
  gd.mode = 'scene'; gd.x = pathX(ry) + 40; gd.y = camY - 20; gd.a = .01; guideTo(pathX(ry) + 78, ry - 62); sfx.guide();

  await say('guide', 'That was brave. This koru is a gift for you.', 3);

async function scenePounamu() {

  await until(() => !g.auto && guideNear(), 5); g.auto = null;
  await talk([['guide', 'You made it to the north side of Mars.', 2.8], ['guide', 'No one has walked here before you.', 2.6], ['astro', 'I walked here. On my OWN legs!', 2.4]]);

async function sceneDoor() {

  const from = proj(SHIP_X + 40, SHIP_Y - 190); g.jewelFloat = false; await gift('jewel', from);

  await ask('Launch!', ''); sfx.click(); await say('astro', 'Bye, Mars. Thanks for having me!', 2.4);
  g.noClamp = true; g.auto = { x: 130, y: 4292 }; await until(() => !g.auto, 5); g.auto = null; g.entering = true; await until(() => g.enterT >= 1, 3);
  g.inShip = true; sh.doorTarget = 0; sfx.door(); await wait(1.3); g.showMoon = true;

function showWin() { game.classList.add('intro'); state = 'win'; winT = 0; parts.length = 0; mood = 'win'; sfx.win(); $('win').classList.add('show'); }
function run(scene, stage) { g.stage = stage; g.scene = true; scene().then(() => g.scene = false); }


function toGame(e) { const r = game.getBoundingClientRect(), s = r.width / 480; return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s }; }
function confirmKey() { if ($('prompt').style.display === 'block') $('prompt').click(); else if (skipNow) skipNow(); }
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true; startAudio();
  if (k === 'm') $('mute').click();
  if (k === ' ' || k === 'enter' || k === 'e') { e.preventDefault(); state === 'title' ? startGame() : confirmKey(); }
  if (k.startsWith('arrow')) e.preventDefault();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointer = null; });
game.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; startAudio(); if (skipNow) skipNow(); pointer = toGame(e); });
addEventListener('pointermove', e => { if (pointer) pointer = toGame(e); });
addEventListener('pointerup', () => pointer = null);
function inputDir() {
  let x = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0), y = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
  if (pointer && !x && !y) { const p = playerScreen(), dx = pointer.x - p.x, dy = pointer.y - (p.y - 30), d = hypot(dx, dy); if (d > 18) { x = dx / d; y = dy / d; } }   // walk toward the finger
  const len = hypot(x, y); return len > 1 ? { x: x / len, y: y / len } : { x, y };
}
$('mute').onclick = function () { muted = !muted; if (master) master.gain.value = muted ? 0 : 1; this.textContent = muted ? '🔇' : '🔊'; this.blur(); };
$('play').onclick = startGame; $('again').onclick = () => location.reload();
function startGame() {
  if (state !== 'title') return; startAudio(); sfx.click(); $('title').style.display = 'none'; game.classList.remove('intro'); state = 'play'; run(sceneIntro, 0);
}


function updatePlay(dt) {
  const sh = g.ship, gd = g.guide, ease = Math.min(1, dt * 10); g.t += dt;
  g.fear += (g.fearTarget - g.fear) * Math.min(1, dt * (g.fearTarget < g.fear ? 1.1 : 2)); g.brave = lerp(g.brave, g.hasKoru ? 1 : 0, Math.min(1, dt * 2.5));
  g.spook = Math.max(0, g.spook - dt * 1.4); if (!g.liftoff) g.shake = Math.max(0, g.shake - dt * 3); g.jumpT = Math.max(0, g.jumpT - dt); g.squeak = Math.max(0, g.squeak - dt);

  let dir = { x: 0, y: 0 }; const speed = lerp(105, 150, g.brave);
  if (g.auto) { const dx = g.auto.x - g.px, dy = g.auto.y - g.py, d = hypot(dx, dy); if (d < 5) g.auto = null; else dir = { x: dx / d * .85, y: dy / d * .85 }; } else if (!g.frozen) dir = inputDir();
  const slow = g.entering ? .8 : 1; g.vx = (g.vx + (dir.x * speed - g.vx) * ease) * slow; g.vy = (g.vy + (dir.y * speed - g.vy) * ease) * slow;
  g.px += g.vx * dt; g.py = clamp(g.py + g.vy * dt, g.minY, g.maxY); if (!g.auto && !g.noClamp) g.px = clamp(g.px, pathX(g.py) - PATH_HALF + 8, pathX(g.py) + PATH_HALF - 8);  
  const sp = hypot(g.vx, g.vy), sn = sin(g.wp); g.walk = lerp(g.walk, clamp(sp / speed, 0, 1), ease); g.wp += dt * sp * lerp(.1, .058, g.brave);
  if (sp > 20 && (sn > 0) !== (g.prevSin > 0)) g.brave > .5 ? sfx.stepB() : sfx.step(); g.prevSin = sn; if (Math.abs(g.vx) > 5) g.face = g.vx > 0 ? 1 : -1;
  if ((g.dustT -= dt) <= 0 && sp > 30 && !g.inShip) { g.dustT = .1; spawn({ x: g.px + rand(-6, 6), y: g.py + 1, vx: rand(-14, 14), vy: rand(-16, -4), life: .6, size: 2.5, grow: 7, color: 'rgba(225,160,110,.55)', alpha: .7 }); }
  if (g.entering) g.enterT = Math.min(1, g.enterT + dt / .7);


  if (g.liftoff) {
    sh.vy += (120 + sh.alt * .5) * dt; sh.alt += sh.vy * dt; sh.y = SHIP_Y - sh.alt; sh.tilt *= Math.max(0, 1 - dt * 4); camY = sh.y - 420;
    for (let i = 0; i < 3; i++) spawn({ x: SHIP_X + rand(-8, 8), y: sh.y + 6, vx: rand(-25, 25), vy: rand(120, 260), life: .6, size: rand(4, 9), grow: -6, color: Math.random() < .5 ? '#ffb347' : '#fff1a8', add: true });
  } else camY += (g.py - 520 - camY) * Math.min(1, dt * 6);
  sh.doorOpen += (sh.doorTarget - sh.doorOpen) * Math.min(1, dt * 3); if (g.moonTarget) g.moonF += (g.moonTarget - g.moonF) * Math.min(1, dt * 3);
  g.north = Math.max(g.north, clamp((3300 - g.py) / 1500, 0, 1));
  if ((sh.smokeT -= dt) <= 0 && !g.liftoff) { sh.smokeT = .28; spawn({ x: SHIP_X - 10 + rand(-3, 3), y: SHIP_Y - 150, vx: rand(-6, 6), vy: -26, life: 2.4, size: 4, grow: 7, color: 'rgba(80,70,80,.5)', alpha: .55 }); }


  if (gd.mode === 'follow') { gd.tx = g.px + 72; gd.ty = g.py - 84 + sin(g.t * 2) * 6; }
  gd.x += (gd.tx - gd.x) * Math.min(1, dt * 2.5); gd.y += (gd.ty - gd.y) * Math.min(1, dt * 2.5); gd.a += ((gd.mode === 'hidden' ? 0 : 1) - gd.a) * Math.min(1, dt * 3);
  if (gd.mode !== 'hidden' && Math.random() < dt * 14) sparkle(gd.x + rand(-14, 14), gd.y + rand(-10, 14), Math.random() < .5 ? '#fff2a8' : '#9ff5d6', { vx: rand(-10, 10), vy: rand(5, 25), size: rand(1.5, 3.2) });
  if (g.jewelFloat && Math.random() < .3) sparkle(SHIP_X + 40 + rand(-14, 14), SHIP_Y - 190 + rand(-14, 14), '#fff6c0', { vy: -10, size: 2.4 });
  if (g.brave > .8 && Math.random() < dt * 2) sparkle(g.px + rand(-12, 12), g.py - 40 + rand(-8, 8), '#fff4c8', { vy: -14 });


  if (!g.hasKoru && !g.frozen && !g.scene && g.stage === 0) {
    if ((g.spookT -= dt) <= 0) { g.spookT = rand(14, 22); g.spook = .8; jump(); sfx.spook(); g.meteor = { x: W + 20, y: rand(20, 60), t: 0 }; if (!g.talking) say('astro', ['EEP!', 'What was THAT?', 'Not the sky too!'][Math.floor(rand(0, 3))], 1.8); }
    if ((g.squeakT -= dt) <= 0) { g.squeakT = rand(5, 9); sfx.squeak(); g.squeak = .3; spawn({ x: g.px + 22, y: g.py - 70, vy: -26, life: 1.1, size: 1, shape: 't', text: 'eep!' }); }
  }
  if (g.meteor) { g.meteor.t += dt; g.meteor.x -= 520 * dt; g.meteor.y += 110 * dt; if (g.meteor.t > 1.1) g.meteor = null; }

  if (!g.scene) {
    if (g.stage === 0 && g.py <= g.minY + 2) run(sceneKoru, 1);
    else if (g.stage === 2 && g.py <= 1502) run(scenePounamu, 3);

      const allowed = w => w === 's' ? !g.hasKoru : w === 'b' ? g.hasKoru && !g.hasPou : g.hasPou;
      const q = QUIPS.find(q => !quipsDone.has(q) && Math.abs(g.py - q[0]) < 26 && allowed(q[1]));
      if (q) { quipsDone.add(q); say('astro', q[2], 2.8); if (q[1] === 's') { sfx.squeak(); g.squeak = .3; } }
    }
  }
  for (const c of critters) {
    const d = hypot(g.px - c.x, g.py - c.y), old = c.peek; c.peek += ((d < 190 && d > 80 ? 1 : 0) - c.peek) * Math.min(1, dt * 5);
    if (old < .5 && c.peek >= .5) sfx.pip();
    if (!c.said && c.peek > .75 && !g.scene && !g.talking && !g.frozen) { c.said = true; say('astro', g.hasKoru ? 'Hello, little blob! I am brave now.' : 'Something just blinked at me!', 2.5); if (!g.hasKoru) { sfx.squeak(); g.squeak = .3; } }
  }

  updateParts(dt); updateHud();
}
function updateHud() {
  const f = clamp(g.fear / 100, 0, 1);
  $('fearbar').style.width = Math.max(8, 208 * f) + 'px'; $('fearbar').style.background = `hsl(${Math.round((1 - f) * 140)},85%,55%)`;
  $('mood').textContent = g.fear > 70 ? 'So scared!' : g.fear > 35 ? 'Nervous' : g.fear > 12 ? 'Getting braver' : 'Brave!';
  game.classList.toggle('scared', g.fear > 55 && g.brave < .5);
  if (g.talking) {   
    const guideTalks = $('bubble').classList.contains('guide'), p = guideTalks ? proj(g.guide.x, g.guide.y) : playerScreen(), ay = guideTalks ? p.y - 44 : p.y - 112 * p.s;
    place($('bubble'), { x: clamp(p.x, 125, 355), y: Math.max(ay - 14, 90) });

}
function update(dt) {
  if (state === 'play') updatePlay(dt);
  else if (state === 'title') { titleT += dt; g.t += dt; if (Math.random() < dt * 3) sparkle(rand(40, 440), rand(120, 400), '#fff2c0', { screen: true, vy: -8, life: 1.4, size: 2 }); updateParts(dt); }
  else { winT += dt; if (Math.random() < dt * 14) sparkle(rand(10, 470), rand(60, 330), ['#fff2a8', '#9ff5d6', '#ffd0a0', '#fff'][Math.floor(rand(0, 4))], { screen: true, vx: rand(-12, 12), vy: rand(-10, 30), life: 1.6, size: rand(2, 5) }); updateParts(dt); }
}


function render() {
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, W, H); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (state === 'win') return drawWin();
  const shake = Math.max(g.spook * 7, g.fear > 55 && g.brave < .5 ? (g.fear - 55) / 45 * 1.4 : 0, g.shake);
  drawWorld(shake); const gd = g.guide;
  if (state === 'title') drawGuide(372, 168, 1, titleT);
  else if (gd.a > .02) { const p = proj(gd.x, gd.y); drawGuide(p.x, p.y, gd.a, g.t); }
  if (g.jewelFloat) { const p = proj(SHIP_X + 40, SHIP_Y - 190); ctx.save(); ctx.translate(p.x, p.y + sin(g.t * 2) * 4); drawMoonJewel(13, .6, 1); ctx.restore(); }
  drawParticles(); drawLaunch();
}
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(frame); }
let last = performance.now();
function fit() { game.style.setProperty('--s', Math.min(innerWidth / 480, innerHeight / 720)); }
addEventListener('resize', fit); fit();
camY = g.py - 520; ['koru', 'pounamu', 'jewel'].forEach((kind, i) => {   
  const slot = document.createElement('div'); slot.className = 'slot'; slot.id = 'slot' + i; slot.style.left = 291 + i * 44 + 'px'; slot.append(itemCanvas(kind, 36, 9, 0)); game.append(slot);
  const names = [['Koru', 'New life, growth and peace.'], ['Pounamu', 'A treasured taonga, traditionally gifted.'], ['Maramataka', 'The Māori lunar calendar, turinh of the moon.']];
  const row = document.createElement('div'); row.className = 'row'; row.style.top = 10 + i * 56 + 'px'; row.append(itemCanvas(kind, 44, 14, .5)); row.insertAdjacentHTML('beforeend', `<h3>${names[i][0]}</h3><p>${names[i][1]}</p>`); $('panel').append(row);
});
$('panel').insertAdjacentHTML('beforeend', '<div class="row" style="top:178px"><i class="star"></i><h3>Matariki</h3><p>Stars that mark the our ansestors.</p></div>');
requestAnimationFrame(frame);
</script>
