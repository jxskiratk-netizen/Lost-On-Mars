<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lost on Mars - My Place in Space</title>
<style>
html,body{margin:0;height:100%;background:#0b0618;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{display:flex;align-items:center;justify-content:center;}
canvas{display:block;touch-action:none;background:#0b0618;outline:none;}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
(() => {
'use strict';


const CONFIG = {
  speedScared: 150,     
  speedBrave: 250,     
  pathHalfWidth: 98,   
  fearAfterKoru: 30,    
  fearAfterPounamu: 8,  
  dialogSpeed: 1,       
  shake: 1,            
  musicVolume: 0.5,
  sfxVolume: 0.9
};

const W = 480, H = 720, HORIZON = 100, TAU = Math.PI * 2;
const KORU_Y = 3230, SITE_Y = 1380, SHIP_X = 108, SHIP_Y = 4335;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => t * t * (3 - 2 * t);
const rnd = (a, b) => a + Math.random() * (b - a);
const F = (px, bold) => (bold ? 'bold ' : '') + px + 'px "Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif';

/* ---------- canvas sizing ---------- */
let K = 1;
function resize() {
  const vw = window.innerWidth || W, vh = window.innerHeight || H;
  const sc = Math.min(vw / W, vh / H);
  cv.style.width = Math.floor(W * sc) + 'px';
  cv.style.height = Math.floor(H * sc) + 'px';
  K = clamp(sc * (window.devicePixelRatio || 1), 1, 2.5);
  cv.width = Math.round(W * K);
  cv.height = Math.round(H * K);
}
window.addEventListener('resize', resize);
resize();

/* =====================================================================
   SOUND  (Web Audio only)
   ===================================================================== */
const Snd = (() => {
  let ac = null, master, music, sfx, noiseBuf, muted = false, mood = 'calm', nextT = 0, step = 0;
  const api = { fearLevel: 0 };
  const P1 = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
  const PM = [220, 261.63, 293.66, 329.63, 392, 440];
  const CH = [[130.8, 196, 261.6], [110, 164.8, 220], [87.3, 130.8, 174.6], [98, 146.8, 196]];

  api.init = () => {
    if (ac) { if (ac.state === 'suspended') { try { ac.resume(); } catch (e) {} } return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
      music = ac.createGain(); music.gain.value = CONFIG.musicVolume; music.connect(master);
      sfx = ac.createGain(); sfx.gain.value = CONFIG.sfxVolume; sfx.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      nextT = ac.currentTime + 0.15;
      setInterval(sched, 80);
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  };
  function tone(f, d, type, v, delay, bus, to, att) {
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
    const a = att || 0.01;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(d, a + 0.03));
    o.connect(g); g.connect(bus || sfx);
    o.start(t0); o.stop(t0 + Math.max(d, a + 0.03) + 0.1);
  }
  function noise(d, v, type, f0, f1, delay, bus) {
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type || 'lowpass';
    fl.frequency.setValueAtTime(f0, t0); fl.frequency.exponentialRampToValueAtTime(f1, t0 + d);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + Math.min(0.1, d / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(fl); fl.connect(g); g.connect(bus || sfx);
    s.start(t0); s.stop(t0 + d + 0.1);
  }
  const arp = (notes, gap, vol, delay, type) => notes.forEach((f, i) => {
    tone(f, 1.3, type || 'sine', vol, (delay || 0) + i * gap);
    tone(f * 2, 0.8, 'triangle', vol * 0.3, (delay || 0) + i * gap);
  });
  function pad(freqs, delay, dur, v) {
    freqs.forEach(f => { tone(f, dur, 'sine', v, delay, music, 0, dur * 0.4); tone(f * 1.004, dur, 'triangle', v * 0.5, delay, music, 0, dur * 0.4); });
  }
  const bpm = () => mood === 'scared' ? 66 : mood === 'brave' ? 100 : mood === 'win' ? 108 : 60;
  function sched() {
    if (!ac || ac.state !== 'running') { if (ac) nextT = ac.currentTime + 0.1; return; }
    let guard = 0;
    while (nextT < ac.currentTime + 0.3 && guard++ < 8) {
      beat(step++, Math.max(0, nextT - ac.currentTime));
      nextT += 30 / bpm();
    }
  }
  function beat(i, d) {
    const R = Math.random;
    if (mood === 'scared') {
      if (i % 32 === 0) pad([110, 164.81], d, 6, 0.05);
      if (i % 4 === 0 && R() < 0.6) tone(PM[(R() * PM.length) | 0] * (R() < 0.3 ? 2 : 1), 1.6, 'triangle', 0.05, d, music, 0, 0.05);
      if (i % 2 === 0 && api.fearLevel > 0.2) {
        tone(62, 0.14, 'sine', 0.16 * api.fearLevel, d, music, 38);
        tone(58, 0.12, 'sine', 0.11 * api.fearLevel, d + 0.2, music, 36);
      }
      if (i % 2 === 1 && R() < 0.08) tone(1568, 0.9, 'sine', 0.02, d, music);
    } else if (mood === 'brave' || mood === 'win') {
      const hi = mood === 'win' ? 2 : 1;
      const pat = [0, 2, 4, 5, 4, 2, 3, 1];
      tone(P1[pat[i % 8]] * hi, 0.4, mood === 'win' ? 'sine' : 'triangle', 0.07, d, music);
      const ch = CH[((i / 8) | 0) % 4];
      if (i % 8 === 0) pad(ch, d, 4.2, 0.045);
      if (i % 4 === 0) tone(ch[0], 0.5, 'sine', 0.09, d, music);
      if (i % 2 === 1) noise(0.05, 0.012, 'highpass', 6000, 8000, d, music);
      if (mood === 'win' && i % 4 === 2 && R() < 0.6) tone(P1[(R() * 8) | 0] * 4, 0.6, 'sine', 0.025, d, music);
    } else {
      if (i % 32 === 0) pad([130.8, 196, 261.6], d, 7, 0.04);
      if (i % 4 === 0 && R() < 0.5) tone(P1[(R() * P1.length) | 0], 1.8, 'sine', 0.04, d, music, 0, 0.05);
    }
  }
  api.setMood = m => { mood = m; };
  api.toggleMute = () => { muted = !muted; if (master) master.gain.value = muted ? 0 : 1; return muted; };
  api.isMuted = () => muted;
  api.squeak = () => { tone(1500, 0.09, 'sine', 0.13, 0, 0, 2400); tone(2300, 0.08, 'sine', 0.11, 0.09, 0, 1500); };
  api.stepS = () => tone(520 + Math.random() * 80, 0.04, 'square', 0.025, 0, 0, 380);
  api.stepB = () => { tone(130, 0.09, 'sine', 0.14, 0, 0, 70); tone(900, 0.03, 'triangle', 0.03); };
  api.blip = who => {
    if (who === 'astro') { const f = 520 + Math.random() * 240; tone(f, 0.05, 'square', 0.03); tone(f * 1.25, 0.06, 'square', 0.03, 0.06); }
    else { tone(880 + Math.random() * 120, 0.18, 'sine', 0.05); tone(1320, 0.18, 'sine', 0.025, 0.07); }
  };
  api.gift = () => { arp([523.25, 659.25, 783.99, 1046.5, 1318.5], 0.11, 0.12); tone(261.6, 2, 'sine', 0.08, 0, 0, 0, 0.4); };
  api.transform = () => { api.gift(); arp([392, 523.25, 659.25, 783.99, 1046.5, 1568], 0.08, 0.07, 0.6); tone(98, 1.6, 'sine', 0.2, 0, 0, 196, 0.2); };
  api.tink = () => { tone(1318.5, 1.2, 'sine', 0.12); tone(1760, 1.0, 'sine', 0.09, 0.05); tone(2637, 0.6, 'sine', 0.04, 0.1); };
  api.unlock = () => {
    tone(900, 0.03, 'square', 0.1); tone(1400, 0.05, 'square', 0.08, 0.07);
    noise(0.9, 0.18, 'bandpass', 300, 1800, 0.25);
    tone(120, 0.3, 'sine', 0.2, 1.0, 0, 60);
  };
  api.door = () => { noise(0.7, 0.16, 'bandpass', 1500, 300); tone(100, 0.25, 'sine', 0.16, 0.6, 0, 55); };
  api.beep = go => go ? tone(990, 0.5, 'square', 0.09) : tone(660, 0.15, 'square', 0.07);
  api.launch = () => {
    noise(4.8, 0.5, 'lowpass', 200, 5000);
    tone(55, 5, 'sawtooth', 0.14, 0, 0, 420, 0.5);
    tone(110, 5, 'square', 0.05, 0, 0, 880, 0.8);
    arp([1046.5, 1318.5, 1568, 2093], 0.2, 0.06, 3.2);
  };
  api.win = () => arp([523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5, 1568], 0.16, 0.12);
  api.spook = () => { noise(0.7, 0.2, 'bandpass', 2500, 400); api.squeak(); };
  api.pip = () => tone(900, 0.07, 'triangle', 0.08, 0, 0, 1400);
  api.thanks = () => { tone(659.25, 0.25, 'sine', 0.12); tone(880, 0.4, 'sine', 0.12, 0.12); };
  api.click = () => { tone(500, 0.08, 'square', 0.06); tone(750, 0.1, 'square', 0.05, 0.07); };
  api.ping = () => { tone(1760, 1.2, 'sine', 0.07); tone(2349, 1.0, 'sine', 0.04, 0.1); };
  api.guideAppear = () => arp([784, 988, 1175, 1568], 0.09, 0.07);
  api.braveStep = () => { tone(98, 0.5, 'sine', 0.25, 0, 0, 55); tone(392, 0.4, 'triangle', 0.08, 0.05); };
  return api;
})();

/* =====================================================================
   WORLD  (Mars path scrolls north = up; world y decreases going north)
   ===================================================================== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ampAt(y) { return sm(clamp((4250 - y) / 350, 0, 1)) * sm(clamp((y - 1330) / 320, 0, 1)) * 64; }
function pathX(y) { return 240 + ampAt(y) * (Math.sin(y / 230) + 0.35 * Math.sin(y / 87 + 1)); }
let camY = 0;
const persp = sy => clamp(0.5 + 0.5 * (sy - HORIZON) / (520 - HORIZON), 0.35, 1.3);
function proj(wx, wy) { const sy = wy - camY, s = persp(sy); return { x: 240 + (wx - 240) * s, y: sy, s }; }

const R = mulberry32(11);
const decor = [], grains = [], skyStars = [];
for (let i = 0; i < 110; i++) skyStars.push({ x: R() * W, y: R() * (HORIZON - 8), r: R() * 1.3 + 0.3, p: R() * TAU, sp: 1 + R() * 2 });
for (let i = 0; i < 1700; i++) grains.push({ x: R() * W, y: 600 + R() * 3950, s: 1 + R() * 2.2, l: R() < 0.5 });
for (let y = 620; y < 4520; y += R() * 22 + 10) {
  const side = R() < 0.5 ? -1 : 1;
  const off = CONFIG.pathHalfWidth + 24 + Math.pow(R(), 1.3) * 220;
  const x = pathX(y) + side * off;
  if (x < -30 || x > 510) continue;
  const r = R();
  if (r < 0.42) decor.push({ t: 'rock', x, y, s: 6 + R() * 18, v: R() });
  else if (r < 0.7) decor.push({ t: 'crater', x, y, s: 12 + R() * 34, v: R() });
  else decor.push({ t: 'pebbles', x, y, s: 4 + R() * 6, v: R() });
}
[[4060, -1], [3900, 1], [3500, -1]].forEach(([y, side]) => decor.push({ t: 'rock', x: pathX(y) + side * (CONFIG.pathHalfWidth + 16), y, s: 21, v: R(), eyes: true }));
[[2600, -1], [1800, 1], [3000, 1], [2200, -1]].forEach(([y, side]) => decor.push({ t: 'rock', x: pathX(y) + side * (CONFIG.pathHalfWidth + 18), y, s: 19, v: R() }));
decor.sort((a, b) => a.y - b.y);

const QUIPS_SRC = [
  { y: 4020, w: 's', t: "That rock has eyes. ROCKS DON'T HAVE EYES." },
  { y: 3820, w: 's', t: "Mars is very red. And very... empty." },
  { y: 3600, w: 's', t: "My knees are clapping. Without me." },
  { y: 3420, w: 's', t: "I only pressed the DO NOT button once." },
  { y: 3300, w: 's', t: "Something follows me. Oh. My shadow." },
  { y: 2900, w: 'b', t: "Brave mode: ON. Mostly." },
  { y: 2600, w: 'b', t: "Hey rocks. Sorry I screamed earlier." },
  { y: 2300, w: 'b', t: "Walking is my superpower. Left, right, repeat." },
  { y: 2000, w: 'b', t: "No footprints here. Just mine. Cool." },
  { y: 1700, w: 'b', t: "North side, here I come!" },
  { y: 1750, w: 'r', t: "Heading home. Please don't be locked again." },
  { y: 2300, w: 'r', t: "Ngā mihi, rocks. You were great." },
  { y: 2900, w: 'r', t: "I wave at a rock. ...Rocks don't wave back." },
  { y: 3500, w: 'r', t: "I'm naming that blob Kevin." },
  { y: 3950, w: 'r', t: "I see the ship! It looks so tiny and crashed." }
];
const CRITTER_SRC = [[3950, 1], [3700, -1], [2750, 1], [2150, -1], [1850, 1]];

const ITEMS = {
  koru: { name: 'Koru (bone pendant)', text: 'A koru is a spiral that stands for new life, growth and peace.', slot: 0 },
  pounamu: { name: 'Pounamu (greenstone)', text: 'A treasured taonga. Pounamu is traditionally gifted.', slot: 1 },
  jewel: { name: 'Moon jewel (story taonga)', text: 'Maramataka is the Māori lunar calendar. It follows the moon\'s phases.', slot: 2 }
};

/* =====================================================================
   GAME STATE
   ===================================================================== */
let state = 'title';
let G = null;
let titleT = 0, winT = 0;

function newGame() {
  G = {
    t: 0, px: 240, py: 4150, vx: 0, vy: 0, wp: 0, face: 1, walkA: 0, prevSin: 0, stepT: 0,
    fear: 100, fearT: 100, brave: 0,
    hasKoru: false, hasPou: false, hasJewel: false, stage: 0,
    minY: KORU_Y, maxY: 4235, frozen: true, scene: null, wait: null,
    bubble: null, caption: null, hint: '', hint2T: 0, prompt: null,
    spook: 0, spookT: 9, shakeExtra: 0, jumpT: 0, squeakT: 5, squeakAnim: 0,
    guide: { x: 330, y: 0, tx: 330, ty: 0, mode: 'hidden', a: 0, sparkT: 0 },
    gift: null, fly: null, ring: null, starPing: false, northProg: 0, matFocus: 0,
    ship: { x: SHIP_X, y: SHIP_Y, tilt: -0.14, doorOpen: 0, doorTarget: 0, slot: 0, socket: 0, flame: 0, vy: 0, alt: 0, smokeT: 0 },
    parts: [], hudPulse: [0, 0, 0], jewelFloat: false,
    autoWalk: null, noClamp: false, entering: false, enterT: 0, playerAlpha: 1, inShip: false,
    showMoon: false, moonF: 0.12, moonTarget: 0.12, count: '', liftoff: false, dustT: 0, meteor: null,
    quips: QUIPS_SRC.map(q => ({ y: q.y, w: q.w, t: q.t, done: false })),
    critters: CRITTER_SRC.map(([y, side]) => ({ y, x: pathX(y) + side * (CONFIG.pathHalfWidth + 32), peek: 0, said: false, pipped: false, cool: 0 }))
  };
  camY = G.py - 520;
  G.guide.y = camY + 30;
}
newGame();

/* ---------- particles ---------- */
function spawn(o) {
  if (G.parts.length > 420) G.parts.shift();
  G.parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 1, age: 0, size: 3, grow: 0, color: '#fff', g: 0, add: false, screen: false, drag: 0, shape: 'c', rot: Math.random() * 6, alpha: 1 }, o));
}
function burst(x, y, n, colors, speed, screen, shape) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = speed * (0.3 + Math.random() * 0.8);
    spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.8 + Math.random() * 0.8, size: 2 + Math.random() * 3.5, color: colors[(Math.random() * colors.length) | 0], add: true, screen: !!screen, drag: 1.2, shape: shape || 's' });
  }
}
function updateParts(dt) {
  const a = G.parts;
  for (let i = a.length - 1; i >= 0; i--) {
    const p = a[i];
    p.age += dt;
    if (p.age >= p.life) { a.splice(i, 1); continue; }
    p.vy += p.g * dt;
    if (p.drag) { const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

/* ---------- scene engine (generators) ---------- */
function startScene(gen) { G.scene = gen(); G.wait = null; stepScene(); }
function stepScene() {
  let guard = 0;
  while (G.scene && guard++ < 50) {
    const r = G.scene.next();
    if (r.done) { G.scene = null; G.wait = null; return; }
    const w = r.value;
    if (w && (w.time > 0 || w.until)) { G.wait = { t: w.time || 0, until: w.until || null, skip: !!w.skip, max: w.max || 0, el: 0 }; return; }
  }
}
function updateScene(dt) {
  if (!G.scene) return;
  const w = G.wait;
  if (!w) { stepScene(); return; }
  w.el += dt;
  const ok = w.until ? (w.until() || (w.max && w.el > w.max)) : w.el >= w.t;
  if (ok) { G.wait = null; stepScene(); }
}
function setBubble(who, text, dur) { G.bubble = { who, text, age: 0, dur }; Snd.blip(who); }
function* say(who, text, dur) {
  dur = (dur || (1.6 + text.length * 0.04)) / CONFIG.dialogSpeed;
  setBubble(who, text, dur);
  yield { time: dur, skip: true };
  G.bubble = null;
  yield { time: 0.12 };
}
function* askButton(label, sub, soundKind) {
  G.prompt = { label, sub, pressed: false, kind: soundKind || 'thanks' };
  yield { until: () => G.prompt.pressed };
  G.prompt = null;
}
function guideTo(x, y) { G.guide.mode = 'scene'; G.guide.tx = x; G.guide.ty = y; }
const guideNear = () => Math.hypot(G.guide.x - G.guide.tx, G.guide.y - G.guide.ty) < 14;
function setCaption(title, text, dur) { G.caption = { title, text, t: 0, dur: dur || 5 }; }

function playerScreen() { return proj(G.px, G.py); }
function shipPart(name) {
  const loc = name === 'slot' ? [0, -34] : [22, -84];
  const th = G.ship.tilt, c = Math.cos(th), s = Math.sin(th);
  const wx = G.ship.x + loc[0] * c - loc[1] * s, wy = G.ship.y + loc[0] * s + loc[1] * c;
  return proj(wx, wy);
}

function startGift(kind, from, dest) {
  G.gift = { kind, t: 0, d1: 1.0, d2: 2.6, d3: 0.9, from, dest, arrived: false };
}
function* giftScene(kind, from, dest) { startGift(kind, from, dest); yield { until: () => !G.gift }; }
function giftArrive(kind) {
  Snd.gift();
  const it = ITEMS[kind];
  setCaption(it.name, it.text, 4.6);
  burst(240, 330, 30, ['#fff3b0', '#9ff5d6', '#ffffff'], 190, true);
  if (kind === 'koru') {
    G.hasKoru = true; G.fearT = CONFIG.fearAfterKoru; Snd.setMood('brave'); Snd.transform();
    G.jumpT = 0.5; G.shakeExtra = 0;
  } else if (kind === 'pounamu') {
    G.hasPou = true; G.fearT = CONFIG.fearAfterPounamu; Snd.tink();
  } else { G.hasJewel = true; Snd.tink(); }
}
function giftDone(kind) {
  G.hudPulse[ITEMS[kind].slot] = 1;
  if (kind === 'jewel') { G.ship.socket = 1; }
  Snd.tink();
}

/* ---------- story scenes ---------- */
function* sceneIntro() {
  G.frozen = true;
  yield { time: 0.8 };
  yield* say('astro', 'Oops. The door shut behind me.');
  Snd.squeak(); G.squeakAnim = 0.4; G.jumpT = 0.35;
  yield* say('astro', "I'm locked out. On MARS.");
  G.starPing = true; Snd.ping();
  yield* say('astro', 'That star up north keeps blinking at me...');
  G.hint = 'Walk north \u2191';
  G.hint2T = 12;
  G.frozen = false;
}

function* sceneKoru() {
  G.frozen = true; G.hint = ''; G.vx = G.vy = 0;
  const ringY = G.py - 120;
  G.guide.mode = 'scene'; G.guide.x = pathX(ringY) + 40; G.guide.y = camY - 20; G.guide.a = 0.01;
  guideTo(pathX(ringY) + 78, ringY - 62);
  Snd.guideAppear();
  yield { until: guideNear, max: 3 };
  yield* say('guide', 'Kia ora, little traveller.');
  G.jumpT = 0.45; G.spook = 1; Snd.squeak(); G.squeakAnim = 0.5;
  yield* say('astro', 'AAAH! A TALKING STAR!', 1.9);
  yield* say('guide', 'Do not fear. I am a kaitiaki, a guardian of this place.', 3.4);
  yield* say('astro', "I'm not screaming. YOU'RE screaming.", 2.4);

function* sceneLaunch() {
  yield* say('astro', 'Bye, Mars. Thanks for having me!', 2.4);
  G.noClamp = true;
  G.autoWalk = { x: 130, y: 4292 };

  G.entering = true;
  yield { until: () => G.enterT >= 1, max: 3 };
  G.inShip = true; G.ship.doorTarget = 0; Snd.door();
  yield { time: 1.3 };
  G.showMoon = true; G.moonF = 0.12;
  const marks = [0.3, 0.55, 0.8];
  for (let n = 3; n >= 1; n--) {
    G.count = String(n); Snd.beep(false);

function startPlay() {

/* =====================================================================
   INPUT
   ===================================================================== */
const keys = {};
const BTN_PLAY = { x: 140, y: 548, w: 200, h: 60 };
const BTN_PROMPT = { x: 110, y: H - 98, w: 260, h: 64 };
const BTN_REPLAY = { x: 140, y: 646, w: 200, h: 54 };
const BTN_MUTE = { x: 430, y: 14, w: 36, h: 36 };
const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const ptr = { down: false, x: 0, y: 0 };

function pressAction() {
  if (!G || state !== 'play') return;
  if (G.prompt && !G.prompt.pressed) { G.prompt.pressed = true; if (G.prompt.kind === 'click') Snd.click(); else Snd.thanks(); return; }
  if (G.gift && G.gift.t > G.gift.d1 + 0.8 && G.gift.t < G.gift.d1 + G.gift.d2) { G.gift.t = G.gift.d1 + G.gift.d2; return; }
  if (G.wait && G.wait.skip && !G.wait.until) G.wait.el = 1e9;
}
window.addEventListener('keydown', e => {
  const k = (e.key || '').toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
  Snd.init();
  keys[k] = true;
  if (k === 'm') { Snd.toggleMute(); return; }
  if (state === 'title' && (k === 'enter' || k === ' ')) startPlay();
  else if (state === 'win' && (k === 'enter' || k === ' ') && winT > 1.5) startPlay();
  else if (state === 'play' && (k === ' ' || k === 'enter' || k === 'e')) pressAction();
});
window.addEventListener('keyup', e => { keys[(e.key || '').toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; ptr.down = false; });
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  Snd.init();
  const p = toCanvas(e);
  if (inRect(p, BTN_MUTE)) { Snd.toggleMute(); return; }
  if (state === 'title') { if (inRect(p, BTN_PLAY)) { Snd.click(); startPlay(); } return; }
  if (state === 'win') { if (winT > 1.2 && inRect(p, BTN_REPLAY)) { Snd.click(); startPlay(); } return; }
  if (G.prompt && inRect(p, BTN_PROMPT)) { pressAction(); return; }
  pressAction();
  ptr.down = true; ptr.x = p.x; ptr.y = p.y;
});
cv.addEventListener('pointermove', e => { if (ptr.down) { const p = toCanvas(e); ptr.x = p.x; ptr.y = p.y; } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => cv.addEventListener(n, () => { ptr.down = false; }));
cv.addEventListener('contextmenu', e => e.preventDefault());

function inputVec() {
  let x = 0, y = 0;
  if (keys['arrowleft'] || keys['a']) x -= 1;
  if (keys['arrowright'] || keys['d']) x += 1;
  if (keys['arrowup'] || keys['w']) y -= 1;
  if (keys['arrowdown'] || keys['s']) y += 1;
  if (ptr.down && !x && !y) {
    const ps = playerScreen();
    const dx = ptr.x - ps.x, dy = ptr.y - (ps.y - 30), d = Math.hypot(dx, dy);
    if (d > 18) { x = dx / d; y = dy / d; }
  }
  const l = Math.hypot(x, y);
  if (l > 1) { x /= l; y /= l; }
  return { x, y };
}

/* =====================================================================
   UPDATE
   ===================================================================== */
function updatePlay(dt) {
  G.t += dt;
  G.fear += (G.fearT - G.fear) * Math.min(1, dt * (G.fearT < G.fear ? 1.1 : 2));
  G.brave = lerp(G.brave, G.hasKoru ? 1 : 0, Math.min(1, dt * 2.5));
  Snd.fearLevel = clamp(G.fear / 100, 0, 1) * (G.hasKoru ? 0 : 1);
  G.spook = Math.max(0, G.spook - dt * 1.4);
  G.shakeExtra = G.liftoff ? G.shakeExtra : Math.max(0, G.shakeExtra - dt * 3);
  G.jumpT = Math.max(0, G.jumpT - dt);
  G.squeakAnim = Math.max(0, G.squeakAnim - dt);
  for (let i = 0; i < 3; i++) G.hudPulse[i] = Math.max(0, G.hudPulse[i] - dt * 0.8);

  updateScene(dt);

  // movement
  let mv = { x: 0, y: 0 };
  const speed = lerp(CONFIG.speedScared, CONFIG.speedBrave, G.brave);
  if (G.autoWalk) {
    const dx = G.autoWalk.x - G.px, dy = G.autoWalk.y - G.py, d = Math.hypot(dx, dy);
    if (d < 5) G.autoWalk = null; else { mv = { x: dx / d * 0.85, y: dy / d * 0.85 }; }
  } else if (!G.frozen) mv = inputVec();
  const kk = Math.min(1, dt * 10);
  G.vx += (mv.x * speed - G.vx) * kk; G.vy += (mv.y * speed - G.vy) * kk;
  if (G.entering) { G.vx *= 0.8; G.vy *= 0.8; }
  G.px += G.vx * dt; G.py += G.vy * dt;
  G.py = clamp(G.py, G.minY, G.maxY);
  if (!G.autoWalk && !G.noClamp) { const cx = pathX(G.py), hw = CONFIG.pathHalfWidth - 8; G.px = clamp(G.px, cx - hw, cx + hw); }
  const sp = Math.hypot(G.vx, G.vy);
  G.walkA = lerp(G.walkA, clamp(sp / speed, 0, 1), Math.min(1, dt * 10));
  G.wp += dt * sp * lerp(0.1, 0.058, G.brave);
  const sn = Math.sin(G.wp);
  if (sp > 20 && ((sn > 0) !== (G.prevSin > 0))) { if (G.brave > 0.5) Snd.stepB(); else Snd.stepS(); }
  G.prevSin = sn;
  if (Math.abs(G.vx) > 5) G.face = G.vx > 0 ? 1 : -1;
  G.dustT -= dt;
  if (sp > 30 && G.dustT <= 0 && !G.inShip) {
    G.dustT = 0.1;
    spawn({ x: G.px + rnd(-6, 6), y: G.py + 1, vx: rnd(-14, 14), vy: rnd(-16, -4), life: 0.6, size: 2.5, grow: 7, color: 'rgba(225,160,110,.55)', alpha: 0.7 });
  }
  if (G.entering) { G.enterT = Math.min(1, G.enterT + dt / 0.7); G.playerAlpha = 1 - G.enterT; }

  // camera
  if (G.liftoff) {
    const sh = G.ship;
    sh.vy += (120 + sh.alt * 0.5) * dt; sh.alt += sh.vy * dt; sh.y = SHIP_Y - sh.alt;
    sh.tilt *= Math.max(0, 1 - dt * 4);
    camY = sh.y - 420;
    for (let i = 0; i < 3; i++) spawn({ x: sh.x + rnd(-8, 8), y: sh.y + 6, vx: rnd(-25, 25), vy: rnd(120, 260), life: 0.6, size: rnd(4, 9), grow: -6, color: Math.random() < 0.5 ? '#ffb347' : '#fff1a8', add: true });
  } else {
    camY += (G.py - 520 - camY) * Math.min(1, dt * 6);
  }

  // ship: door anim, smoke
  const sh = G.ship;
  sh.doorOpen += (sh.doorTarget - sh.doorOpen) * Math.min(1, dt * 3);
  sh.smokeT -= dt;
  if (sh.smokeT <= 0 && !G.liftoff) {
    sh.smokeT = 0.28;
    spawn({ x: sh.x - 10 + rnd(-3, 3), y: sh.y - 150, vx: rnd(-6, 6), vy: -26, life: 2.4, size: 4, grow: 7, color: 'rgba(80,70,80,.5)', alpha: 0.55 });
  }
  G.moonF += (G.moonTarget - G.moonF) * Math.min(1, dt * 3);
  if (G.northProg < 1) G.northProg = Math.max(G.northProg, clamp((3300 - G.py) / 1500, 0, 1));

  // guide
  const gd = G.guide;
  if (gd.mode === 'follow') { gd.tx = G.px + 72; gd.ty = G.py - 84 + Math.sin(G.t * 2) * 6; }
  gd.x += (gd.tx - gd.x) * Math.min(1, dt * 2.5); gd.y += (gd.ty - gd.y) * Math.min(1, dt * 2.5);
  gd.a += ((gd.mode === 'hidden' ? 0 : 1) - gd.a) * Math.min(1, dt * 3);
  gd.sparkT -= dt;
  if (gd.mode !== 'hidden' && gd.sparkT <= 0) {
    gd.sparkT = 0.07;
    spawn({ x: gd.x + rnd(-14, 14), y: gd.y + rnd(-10, 14), vx: rnd(-10, 10), vy: rnd(5, 25), life: 0.9, size: rnd(1.5, 3.2), color: Math.random() < 0.5 ? '#fff2a8' : '#9ff5d6', add: true, shape: 's' });
  }

  // jewel float particles
  if (G.jewelFloat && Math.random() < 0.3) spawn({ x: G.ship.x + 40 + rnd(-14, 14), y: G.ship.y - 190 + rnd(-14, 14), vy: -10, life: 0.9, size: 2.4, color: '#fff6c0', add: true, shape: 's' });

  // brave sparkles near the koru
  if (G.brave > 0.8 && Math.random() < dt * 2) spawn({ x: G.px + rnd(-12, 12), y: G.py - 40 + rnd(-8, 8), vy: -14, life: 0.9, size: 2.5, color: '#fff4c8', add: true, shape: 's' });

  // scary stuff before the koru
  if (!G.hasKoru && !G.frozen && !G.scene && G.stage === 0) {
    G.spookT -= dt;
    if (G.spookT <= 0) {
      G.spookT = 14 + Math.random() * 8;
      G.spook = 0.8; G.jumpT = 0.4; G.squeakAnim = 0.4; Snd.spook();
      G.meteor = { x: W + 20, y: 20 + Math.random() * 40, t: 0 };
      if (!G.bubble) setBubble('astro', ['EEP!', 'What was THAT?', 'Not the sky too!'][(Math.random() * 3) | 0], 1.8);
    }
    G.squeakT -= dt;
    if (G.squeakT <= 0) {
      G.squeakT = 5 + Math.random() * 4; Snd.squeak(); G.squeakAnim = 0.3;
      spawn({ x: G.px + 22, y: G.py - 70, vy: -26, life: 1.1, size: 1, shape: 't', text: 'eep!', color: '#ffffff' });
    }
  }
  if (G.meteor) { G.meteor.t += dt; G.meteor.x -= 520 * dt; G.meteor.y += 110 * dt; if (G.meteor.t > 1.1) G.meteor = null; }

  // triggers
  if (!G.scene) {
    if (G.stage === 0 && G.py <= G.minY + 2) { G.stage = 1; startScene(sceneKoru); }
    else if (G.stage === 2 && G.py <= 1502) { G.stage = 3; startScene(scenePounamu); }
    else if (G.stage === 4 && G.hasPou && G.py >= 4195) { G.stage = 5; startScene(sceneDoor); }
    else if (!G.frozen && !G.bubble && !G.gift) {
      for (const q of G.quips) {
        if (q.done) continue;
        const ok = q.w === 's' ? !G.hasKoru : q.w === 'b' ? (G.hasKoru && !G.hasPou) : G.hasPou;
        if (ok && Math.abs(G.py - q.y) < 26) {
          q.done = true; setBubble('astro', q.t, 2.8);
          if (q.w === 's') { Snd.squeak(); G.squeakAnim = 0.3; }
          break;
        }
      }
    }
  }

  // critters
  for (const c of G.critters) {
    const d = Math.hypot(G.px - c.x, G.py - c.y);
    c.cool = Math.max(0, c.cool - dt);
    const target = (d < 190 && d > 80) ? 1 : 0;
    const old = c.peek;
    c.peek += (target - c.peek) * Math.min(1, dt * 5);
    if (old < 0.5 && c.peek >= 0.5 && !c.pipped) { c.pipped = true; Snd.pip(); }
    if (c.peek < 0.1) c.pipped = false;
    if (!c.said && c.peek > 0.75 && !G.scene && !G.bubble && !G.frozen) {
      c.said = true;
      if (G.hasKoru) setBubble('astro', 'Hello, little blob! I am brave now.', 2.6);
      else { setBubble('astro', 'Something just blinked at me!', 2.4); Snd.squeak(); G.squeakAnim = 0.3; }
    }
  }

  // bubble / caption / ring / gift / fly
  if (G.bubble) { G.bubble.age += dt; if (G.bubble.age > G.bubble.dur + 3) G.bubble = null; }
  if (G.caption) { G.caption.t += dt; if (G.caption.t > G.caption.dur) G.caption = null; }
  if (G.ring) G.ring.t += dt;
  if (G.hint2T > 0) G.hint2T -= dt;
  if (G.gift) {
    const g = G.gift;
    g.t += dt;
    if (!g.arrived && g.t >= g.d1) { g.arrived = true; giftArrive(g.kind); }
    if (g.t >= g.d1 && g.t < g.d1 + g.d2 && Math.random() < 0.5) spawn({ x: 240 + rnd(-60, 60), y: 330 + rnd(-60, 60), vy: -20, life: 1, size: rnd(2, 4), color: '#fff6c0', add: true, screen: true, shape: 's' });
    if (g.t >= g.d1 + g.d2 + g.d3) { const k = g.kind; G.gift = null; giftDone(k); }
  }
  if (G.fly) {
    G.fly.t += dt;
    if (G.fly.t >= G.fly.dur) { const f = G.fly; G.fly = null; f.done && f.done(); }
  }
  updateParts(dt);
}

function update(dt) {
  if (state === 'play') updatePlay(dt);
  else if (state === 'title') {
    titleT += dt; G.t += dt;
    G.ship.smokeT -= dt;
    if (G.ship.smokeT <= 0) { G.ship.smokeT = 0.28; spawn({ x: G.ship.x - 10, y: G.ship.y - 150, vx: rnd(-6, 6), vy: -26, life: 2.4, size: 4, grow: 7, color: 'rgba(80,70,80,.5)', alpha: 0.55 }); }
    if (Math.random() < dt * 3) spawn({ x: rnd(40, 440), y: rnd(120, 400), vy: -8, life: 1.4, size: 2, color: '#fff2c0', add: true, screen: true, shape: 's' });
    updateParts(dt);
  } else if (state === 'win') {
    winT += dt;
    if (Math.random() < dt * 14) spawn({ x: rnd(10, 470), y: rnd(60, 330), vx: rnd(-12, 12), vy: rnd(-10, 30), life: 1.6, size: rnd(2, 5), color: ['#fff2a8', '#9ff5d6', '#ffd0a0', '#ffffff'][(Math.random() * 4) | 0], add: true, screen: true, shape: 's' });
    updateParts(dt);
  }
}

/* =====================================================================
   DRAWING HELPERS
   ===================================================================== */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrap(text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function starShape(r1, r2, pts, rot) {
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = (rot || 0) + i * Math.PI / pts - Math.PI / 2, r = i % 2 ? r2 : r1;
    if (i) ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
}
function glowDisc(r, color0, color1, alpha) {
  const prev = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, color0); g.addColorStop(1, color1);
  ctx.globalAlpha *= alpha; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = prev;
}

/* ---------- the three taonga ---------- */
function drawKoru(r, glow) {
  ctx.save();
  if (glow) { const a = ctx.globalAlpha; glowDisc(r * 2.2, 'rgba(255,240,200,.7)', 'rgba(255,240,200,0)', glow); ctx.globalAlpha = a; }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const Rr = r * 0.55, turns = 1.55 * TAU;
  ctx.translate(0, -Rr * 0.55);

    ctx.beginPath(); ctx.moveTo(Rr * 0.55, Rr * 2.1); ctx.quadraticCurveTo(Rr * 1.15, Rr * 1.1, Rr, 0);

function drawFly() {
  const f = G.fly;
  if (!f) return;
  const u = sm(clamp(f.t / f.dur, 0, 1)), to = f.to();
  const x = lerp(f.from.x, to.x, u), y = lerp(f.from.y, to.y, u) - Math.sin(u * Math.PI) * 26;
  ctx.save(); ctx.translate(x, y); drawItem(f.kind, lerp(f.s0, f.s1, u), 1, G.t); ctx.restore();
  if (Math.random() < 0.6) spawn({ x, y, vy: 10, life: 0.6, size: 2.4, color: '#9ff5d6', add: true, screen: true, shape: 's' });
}
function drawMoonLaunch() {
  if (!G.showMoon) return;
  const p = proj(G.ship.x, G.ship.y), s = p.s;
  const mx = p.x - 8, my = p.y - 230 * s;
  ctx.save();
  const bg = ctx.createLinearGradient(0, my, 0, p.y - 110 * s);
  bg.addColorStop(0, 'rgba(255,248,200,.5)'); bg.addColorStop(1, 'rgba(255,248,200,0)');
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(mx - 10, my + 20); ctx.lineTo(mx + 10, my + 20); ctx.lineTo(mx + 46 * s, p.y - 110 * s); ctx.lineTo(mx - 46 * s, p.y - 110 * s); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.translate(mx, my);
  glowDisc(70, 'rgba(255,248,200,.6)', 'rgba(255,248,200,0)', 1);
  drawMoonDisc(26, G.moonF, false);
  if (G.moonF > 0.96) { ctx.fillStyle = '#fff6c8'; ctx.font = F(13, true); ctx.textAlign = 'center'; ctx.fillText('Rākaunui \u00b7 full moon', 0, 46); }
  else { ctx.fillStyle = '#fff6c8'; ctx.font = F(12, false); ctx.textAlign = 'center'; ctx.fillText('maramataka moon', 0, 46); }
  ctx.restore();
}
function drawCount() {
  if (!G.count) return;
  const k = (G.t * 4) % 1.0;
  ctx.save(); ctx.translate(240, 300);
  ctx.globalAlpha = 1; const s = 1 + (1 - Math.min(1, k * 2)) * 0.25;
  ctx.scale(s, s);
  ctx.font = F(G.count === 'GO!' ? 84 : 100, true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 8; ctx.strokeStyle = '#5a1d1a'; ctx.strokeText(G.count, 0, 0);
  ctx.fillStyle = '#fff3a8'; ctx.fillText(G.count, 0, 0);
  ctx.restore(); ctx.textBaseline = 'alphabetic';
}

/* ---------- screens ---------- */
function drawWorld(shake) {
  ctx.save();
  if (shake > 0.05) ctx.translate((Math.random() - 0.5) * 2 * shake, (Math.random() - 0.5) * 2 * shake);
  drawSky(G.t);
  ctx.save(); ctx.beginPath(); ctx.rect(-30, HORIZON - 3, W + 60, H); ctx.clip();
  drawGround(); drawPath(); drawClearing(G.t); drawRing(G.t); drawObjects();
  const hg = ctx.createLinearGradient(0, HORIZON, 0, HORIZON + 150);
  hg.addColorStop(0, 'rgba(255,190,150,.6)'); hg.addColorStop(1, 'rgba(255,190,150,0)');
  ctx.fillStyle = hg; ctx.fillRect(-30, HORIZON - 3, W + 60, 153);
  ctx.restore();
  ctx.restore();
}
function shakeAmount() {
  if (!CONFIG.shake) return 0;
  const fs = (G.fear > 55 && G.brave < 0.5) ? (G.fear - 55) / 45 * 1.4 : 0;
  return Math.max(G.spook * 7, fs, G.shakeExtra) * CONFIG.shake;
}
function renderPlay() {
  drawWorld(shakeAmount());
  const gd = G.guide;
  if (gd.a > 0.02) { const p = proj(gd.x, gd.y); drawGuideAt(p.x, p.y, 1, gd.a, G.t); }
  if (G.jewelFloat) {
    const p = proj(G.ship.x + 40, G.ship.y - 190);
    ctx.save(); ctx.translate(p.x, p.y + Math.sin(G.t * 2) * 4); const ph = jewelPhase(G.t); drawMoonJewel(13, ph.f, ph.waning, 1); ctx.restore();
  }
  drawParticles();
  if (G.liftoff) {
    drawSpaceOverlay();
    const p = proj(G.ship.x, G.ship.y);
    const sc = G.ship.alt < 1000 ? 1 : clamp(1 - (G.ship.alt - 1000) / 2800, 0.3, 1);
    drawShip(p.x, p.y, p.s * sc, G.ship, G.t, true);
    drawParticles();
  }
  drawMoonLaunch();
  drawFly();
  drawHUD();
  drawBubble();
  drawCaption();
  drawGift();
  drawCount();
  if (G.prompt) drawButton(BTN_PROMPT, G.prompt.label, G.prompt.sub, G.t);
  drawHint();
}
function renderTitle() {
  G.guide.mode = 'hidden';
  drawWorld(0);
  const t = titleT;
  drawParticles();
  const p = proj(240, 4150);
  drawAstro(p.x, p.y, p.s * 1.15, { brave: 0, fear: 1, t, walk: 0, wp: 0, face: 1, vx: 0, alpha: 1, jump: 0, squeak: (t % 4) < 0.25 ? 1 : 0 });
  drawGuideAt(372, 168, 0.9, 1, t);
  ctx.save();
  const shade = ctx.createLinearGradient(0, 0, 0, 300); shade.addColorStop(0, 'rgba(8,3,22,.55)'); shade.addColorStop(1, 'rgba(8,3,22,0)');
  ctx.fillStyle = shade; ctx.fillRect(0, 0, W, 300);
  ctx.textAlign = 'center';
  ctx.font = F(52, true); ctx.lineWidth = 9; ctx.strokeStyle = '#4a1218'; ctx.lineJoin = 'round';
  ctx.strokeText('LOST ON MARS', 240, 190);
  const tg = ctx.createLinearGradient(0, 150, 0, 195); tg.addColorStop(0, '#fff3a8'); tg.addColorStop(1, '#ff9a4a');
  ctx.fillStyle = tg; ctx.fillText('LOST ON MARS', 240, 190);
  ctx.font = F(16, true); ctx.fillStyle = '#ffe9d2'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,10,20,.8)';
  ctx.strokeText('My Place in Space \u00b7 a Māori star story', 240, 222); ctx.fillText('My Place in Space \u00b7 a Māori star story', 240, 222);
  ctx.restore();
  drawButton(BTN_PLAY, 'Play', '', t);
  ctx.save(); ctx.font = F(14, true); ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,10,20,.85)'; ctx.fillStyle = '#fff3c8';
  const line = 'Arrow keys / WASD to walk, or touch and hold.';
  ctx.strokeText(line, 240, 650); ctx.fillText(line, 240, 650);
  ctx.restore();
  drawMuteIcon();
}
function drawWin() {
  const t = winT;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#04021a'); g.addColorStop(1, '#2a0f3a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 100; i++) { ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(t * 1.5 + i)); ctx.fillRect((i * 97.3) % W, (i * 53.1) % 330, 1.8, 1.8); }
  ctx.globalAlpha = 1;
  drawMatariki(380, 60, 1.2, 1, t, 1);
  ctx.save(); ctx.translate(100, 80); drawMoonJewel(26, 1, false, 1); ctx.restore();
  const bobY = Math.sin(t * 2) * 5;
  ctx.save(); ctx.translate(240, 190 + bobY); const sh = { tilt: 0, doorOpen: 0, slot: 1, socket: 1, flame: 0.6 };
  drawShip(0, 0, 0.55, sh, t, true); ctx.restore();
  ctx.textAlign = 'center';
  ctx.font = F(42, true); ctx.lineWidth = 8; ctx.strokeStyle = '#3a1020'; ctx.lineJoin = 'round';
  ctx.strokeText('Home safe!', 240, 262);
  const tg = ctx.createLinearGradient(0, 230, 0, 265); tg.addColorStop(0, '#fff3a8'); tg.addColorStop(1, '#ff9a4a');
  ctx.fillStyle = tg; ctx.fillText('Home safe!', 240, 262);
  ctx.font = F(15, false); ctx.fillStyle = '#ffe9d2'; ctx.fillText('The astronaut is not scared anymore. Kia kaha!', 240, 290);
  ctx.fillStyle = 'rgba(10,4,25,.55)'; rr(24, 308, 432, 238, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,228,138,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  const recap = [['koru', 'Koru', 'New life, growth and peace.'], ['pounamu', 'Pounamu', 'A treasured taonga, traditionally gifted.'], ['jewel', 'Maramataka', 'The Māori lunar calendar, following the moon.'], ['star', 'Matariki', 'Stars that mark the Māori new year.']];
  recap.forEach((r, i) => {
    const y = 342 + i * 56;
    ctx.save(); ctx.translate(66, y + 4);
    if (r[0] === 'star') { glowDisc(18, 'rgba(190,225,255,.7)', 'rgba(190,225,255,0)', 1); ctx.fillStyle = '#eaf4ff'; starShape(10, 4, 5, 0); ctx.fill(); }
    else drawItem(r[0], 14, 0.5, t);
    ctx.restore();
    ctx.textAlign = 'left'; ctx.fillStyle = '#ffe48a'; ctx.font = F(16, true); ctx.fillText(r[1], 104, y);
    ctx.fillStyle = '#fff'; ctx.font = F(13, false); ctx.fillText(r[2], 104, y + 20);
  });
  ctx.textAlign = 'center'; ctx.font = F(13, false); ctx.fillStyle = '#e9dcff';
  ctx.font = F(13, false);
  wrap('Inspired by Māori astronomy and culture. Learn more at Te Papa and Te Ara.', 400).forEach((l, i) => ctx.fillText(l, 240, 578 + i * 18));
  drawParticles();
  if (t > 1.2) drawButton(BTN_REPLAY, 'Play again', '', t);
  drawMuteIcon();
}

function render() {
  const k = cv.width / W;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (state === 'title') renderTitle();
  else if (state === 'play') renderPlay();
  else drawWin();
}

/* ---------- main loop ---------- */
let last = 0;
function frame(now) {
  if (!last) last = now;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  try { update(dt); render(); } catch (e) { if (window.console) console.error(e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__lostOnMars = { get state() { return state; }, get G() { return G; } };
})();
</script>
